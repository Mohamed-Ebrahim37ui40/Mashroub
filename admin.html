<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f4e37"><link rel="manifest" href="manifest.webmanifest"><title>إدارة المشروبات</title><style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b1d14;--mut:#7a6a5e;--pri:#6f4e37;--bd:#eadfd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,Arial;padding-bottom:30px}
header{background:var(--pri);color:white;padding:18px;text-align:center;font-size:22px;font-weight:800}main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border:1px solid var(--bd);border-radius:14px;padding:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px}button{background:var(--pri);color:white;border:0;font-weight:700}.sec{background:white;color:var(--pri);border:1px solid var(--pri)}.bad{background:#a52a2a}.ok{background:#287a45}
input,select,textarea{width:100%;margin:5px 0 12px;background:white;color:#241a14}label,.muted{color:var(--mut);font-size:13px}.price,.stat{color:var(--pri);font-weight:800}.stat{font-size:27px}
.pic{height:100px;background:#f0e6dc;border-radius:10px;display:grid;place-items:center;font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:white;color:var(--tx);border:1px solid var(--bd)}.tabs .on{background:var(--pri);color:white}
.notice{background:#fffaf5;border:1px solid #d8c6b5;border-radius:12px;padding:12px;margin:10px 0}
</style></head><body><header>⚙️ إدارة المشروبات</header><main id="app"></main>
<script>
const KEY='drinks_data_v2',defaults={shop:'قائمة المشروبات الساخنة',currency:'جنيه',menu:[{id:1,name:'قهوة عربية',price:8,emoji:'☕',active:true},{id:2,name:'شاي أحمر',price:5,emoji:'🍵',active:true},{id:3,name:'شاي بالحليب',price:7,emoji:'🫖',active:true},{id:4,name:'كابتشينو',price:14,emoji:'☕',active:true},{id:5,name:'شوكولاتة ساخنة',price:15,emoji:'🍫',active:true},{id:6,name:'زنجبيل بالعسل',price:9,emoji:'🍯',active:true}],vendors:[{id:'v1',name:'مقدم المشروبات 1',phone:'',active:true}],orders:[]};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaults}catch(e){return defaults}}let D=load(),tab='orders',month=new Date().toISOString().slice(0,7);
const $=x=>document.getElementById(x),money=n=>Number(n).toLocaleString('ar-EG')+' '+D.currency;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function render(){D=load();let tabs=[['orders','الطلبات'],['menu','المنيو والأسعار'],['vendors','مقدمو المشروبات'],['summary','التقرير الشهري'],['settings','الإعدادات والنسخ الاحتياطي']];$('app').innerHTML='<div class="notice">تُحفظ البيانات محليًا على الجهاز الحالي. المزامنة بين أجهزة مختلفة تحتاج قاعدة بيانات سحابية مشتركة.</div><div class="tabs">'+tabs.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>'+({orders:orders,menu:menu,vendors:vendors,summary:summary,settings:settings}[tab]())}
function orders(){return D.orders.slice().sort((a,b)=>b.time-a.time).map(o=>'<div class="card"><div class="row"><b>طلب #'+o.number+' — '+esc(o.name)+'</b><b>'+money(o.total)+'</b></div><div class="muted">'+new Date(o.time).toLocaleString('ar-EG')+' · '+esc(o.phone)+' · '+esc(o.status)+'</div>'+o.items.map(i=>'<div>'+esc(i.name)+' × '+i.qty+'</div>').join('')+'<label>تغيير مقدم المشروبات</label><select onchange="assign('+o.id+',this.value)">'+D.vendors.map(v=>'<option value="'+v.id+'" '+(v.id===o.vendorId?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select><div class="row"><button class="ok" onclick="setStatus('+o.id+',\'مكتمل\')">اكتمل</button><button class="sec" onclick="setStatus('+o.id+',\'قيد التحضير\')">قيد التحضير</button></div></div>').join('')||'<p>لا توجد طلبات.</p>'}
function assign(id,v){let o=D.orders.find(x=>x.id===id);if(o)o.vendorId=v;save();render()}function setStatus(id,s){let o=D.orders.find(x=>x.id===id);o.status=s;save();render()}
function menu(){return '<button onclick="editMenu()">+ إضافة مشروب</button>'+D.menu.map(m=>'<div class="card row"><div><b>'+esc(m.name)+'</b><div>'+money(m.price)+' · '+(m.active?'متاح':'مخفي')+'</div></div><div class="row"><button class="sec" onclick="editMenu('+m.id+')">تعديل</button><button class="sec" onclick="toggle('+m.id+')">إظهار/إخفاء</button><button class="bad" onclick="removeMenu('+m.id+')">حذف</button></div></div>').join('')}
function editMenu(id){let m=D.menu.find(x=>x.id===id)||{name:'',price:0,active:true,emoji:'☕'};let n=prompt('اسم المشروب',m.name);if(n===null)return;let p=prompt('السعر',m.price);if(p===null||!n.trim()||!isFinite(+p))return alert('بيانات غير صحيحة');if(id){m.name=n;m.price=+p}else D.menu.push({id:Date.now(),name:n,price:+p,emoji:'☕',active:true});save();render()}
function toggle(id){let m=D.menu.find(x=>x.id===id);m.active=!m.active;save();render()}function removeMenu(id){if(confirm('حذف الصنف؟')){D.menu=D.menu.filter(x=>x.id!==id);save();render()}}
function vendors(){return D.vendors.map(v=>'<div class="card"><label>اسم مقدم المشروبات</label><input id="n'+v.id+'" value="'+esc(v.name)+'"><label>رقم واتساب مع مفتاح الدولة</label><input id="p'+v.id+'" value="'+esc(v.phone)+'"><div class="row"><button onclick="saveVendor(\''+v.id+'\')">حفظ</button><button class="sec" onclick="toggleVendor(\''+v.id+'\')">'+(v.active?'إيقاف':'تفعيل')+'</button><button class="bad" onclick="delVendor(\''+v.id+'\')">حذف</button></div></div>').join('')+'<button onclick="addVendor()">+ إضافة مقدم</button>'}
function addVendor(){D.vendors.push({id:'v'+Date.now(),name:'مقدم جديد',phone:'',active:true});save();render()}function saveVendor(id){let v=D.vendors.find(x=>x.id===id);v.name=$('n'+id).value;v.phone=$('p'+id).value.replace(/\\D/g,'');save();render()}function toggleVendor(id){let v=D.vendors.find(x=>x.id===id);v.active=!v.active;save();render()}function delVendor(id){if(D.vendors.length<2)return alert('احتفظ بمقدم واحد على الأقل');if(confirm('حذف المقدم؟')){D.vendors=D.vendors.filter(v=>v.id!==id);save();render()}}
function summary(){let os=D.orders.filter(o=>new Date(o.time).toISOString().slice(0,7)===month),done=os.filter(o=>o.status==='مكتمل'),sum=done.reduce((s,o)=>s+o.total,0);return '<label>الشهر</label><input type="month" value="'+month+'" onchange="month=this.value;render()"><div class="grid"><div class="card">إجمالي الطلبات<div class="stat">'+os.length+'</div></div><div class="card">الطلبات المكتملة<div class="stat">'+done.length+'</div></div><div class="card">إجمالي المبيعات<div class="stat">'+money(sum)+'</div></div></div><h3>مبيعات كل مقدم مشروبات</h3>'+D.vendors.map(v=>{let a=done.filter(o=>o.vendorId===v.id);return '<div class="card row"><b>'+esc(v.name)+'</b><span>'+a.length+' طلب مكتمل</span><b>'+money(a.reduce((s,o)=>s+o.total,0))+'</b></div>'}).join('')}
function settings(){return '<div class="card"><label>اسم المحل</label><input id="shop" value="'+esc(D.shop)+'"><label>العملة</label><input id="currency" value="'+esc(D.currency)+'"><button onclick="D.shop=$(\'shop\').value;D.currency=$(\'currency\').value;save();render()">حفظ</button></div><div class="card"><h3>رابط QR ثابت لصفحة العرض</h3><p class="muted">ضع رابط menu.html المنشور في مولّد QR خارجي أو اطلب دمج مكتبة QR محلية عند تجهيز رابط الاستضافة.</p><label>رابط صفحة العرض</label><input id="url" placeholder="https://your-site/menu.html"><button class="sec" onclick="navigator.clipboard?.writeText($('url').value);alert('تم نسخ الرابط')">نسخ رابط العرض</button></div><div class="card"><button onclick="exportData()">تصدير نسخة JSON</button><label>استيراد نسخة احتياطية</label><input type="file" accept=".json" onchange="importData(this)"></div>''}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.href=u;a.download='drinks-backup.json';a.click();URL.revokeObjectURL(u)}function importData(i){let f=i.files[0],r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render()}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
if(!localStorage.getItem(KEY)){D=defaults;save()}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></main></body></html>

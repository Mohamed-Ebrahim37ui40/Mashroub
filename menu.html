<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f4e37"><link rel="manifest" href="manifest.webmanifest"><title>قائمة المشروبات</title><style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b1d14;--mut:#7a6a5e;--pri:#6f4e37;--bd:#eadfd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,Arial;padding-bottom:30px}
header{background:var(--pri);color:white;padding:18px;text-align:center;font-size:22px;font-weight:800}main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border:1px solid var(--bd);border-radius:14px;padding:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px}button{background:var(--pri);color:white;border:0;font-weight:700}.sec{background:white;color:var(--pri);border:1px solid var(--pri)}.bad{background:#a52a2a}.ok{background:#287a45}
input,select,textarea{width:100%;margin:5px 0 12px;background:white;color:#241a14}label,.muted{color:var(--mut);font-size:13px}.price,.stat{color:var(--pri);font-weight:800}.stat{font-size:27px}
.pic{height:100px;background:#f0e6dc;border-radius:10px;display:grid;place-items:center;font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:white;color:var(--tx);border:1px solid var(--bd)}.tabs .on{background:var(--pri);color:white}
.notice{background:#fffaf5;border:1px solid #d8c6b5;border-radius:12px;padding:12px;margin:10px 0}
</style></head><body><header id="head">☕ قائمة المشروبات</header><main id="app"></main>
<script>
const KEY='drinks_data_v2',def={shop:'قائمة المشروبات الساخنة',currency:'جنيه',menu:[{id:1,name:'قهوة عربية',price:8,emoji:'☕',active:true},{id:2,name:'شاي أحمر',price:5,emoji:'🍵',active:true},{id:3,name:'شاي بالحليب',price:7,emoji:'🫖',active:true},{id:4,name:'كابتشينو',price:14,emoji:'☕',active:true},{id:5,name:'شوكولاتة ساخنة',price:15,emoji:'🍫',active:true},{id:6,name:'زنجبيل بالعسل',price:9,emoji:'🍯',active:true}],vendors:[{id:'v1',name:'مقدم المشروبات 1',phone:'',active:true}],orders:[]};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||def}catch(e){return def}}let D=load(),cart={};
const $=x=>document.getElementById(x),money=n=>Number(n).toLocaleString('ar-EG')+' '+D.currency;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function render(){$('head').textContent='☕ '+D.shop;$('app').innerHTML='<div class="notice">اختر المشروبات والكميات ثم أرسل طلبك.</div><div class="grid">'+D.menu.filter(m=>m.active).map(m=>'<div class="card"><div class="pic">'+(m.emoji||'☕')+'</div><b>'+esc(m.name)+'</b><div class="price">'+money(m.price)+'</div><div class="row"><button onclick="chg('+m.id+',1)">+</button><b>'+(cart[m.id]||0)+'</b><button class="sec" onclick="chg('+m.id+',-1)">−</button></div></div>').join('')+'</div>'+(Object.values(cart).some(Boolean)?'<div class="card row"><b>الإجمالي: '+money(total())+'</b><button onclick="checkout()">إتمام الطلب</button></div>':'')}
function chg(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);render()}
function total(){return D.menu.reduce((s,m)=>s+(cart[m.id]||0)*m.price,0)}
function checkout(){let name=prompt('الاسم');if(!name)return;let phone=prompt('رقم واتساب');let note=prompt('ملاحظات أو عنوان')||'';let active=D.vendors.filter(v=>v.active);if(!active.length)return alert('لا يوجد مقدم متاح');let v=active.sort((a,b)=>D.orders.filter(o=>o.vendorId===a.id&&o.status!=='مكتمل').length-D.orders.filter(o=>o.vendorId===b.id&&o.status!=='مكتمل').length)[0];let items=D.menu.filter(m=>cart[m.id]).map(m=>({name:m.name,price:+m.price,qty:cart[m.id]}));let o={id:Date.now(),number:String(Date.now()).slice(-5),time:Date.now(),name,phone,note,vendorId:v.id,items,total:items.reduce((s,i)=>s+i.price*i.qty,0),status:'جديد'};D.orders.push(o);save();cart={};alert('تم تسجيل الطلب رقم '+o.number+' — مقدم الطلب: '+v.name);render()}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></main></body></html>
